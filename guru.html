body{

.g-title{font-size:22px;font-weight:800;text-align:center;margin:0 0 4px}

.g-input,.g-select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--hatch-widget-border);background:var(--hatch-widget-surface-muted);color:var(--hatch-widget-text);font-size:15px;font-weight:600}
.g-input:focus,.g-select:focus{outline:2px solid var(--hatch-widget-focus);outline-offset:1px;border-color:var(--hatch-widget-accent)}
.g-dd{position:relative}
.g-ddlist{position:absolute;top:100%;left:0;right:0;max-height:260px;overflow-y:auto;background:var(--hatch-widget-surface);border:1.5px solid var(--hatch-widget-border);border-radius:12px;margin-top:4px;z-index:50;display:none;box-shadow:0 8px 24px var(--hatch-widget-shadow)}
.g-dditem{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--hatch-widget-border)}
.g-dditem:last-child{border-bottom:none}
.g-dditem b{display:block;font-size:14px}
.g-dditem span{font-size:11px;color:var(--hatch-widget-muted)}
.g-dditem:active{background:var(--hatch-widget-surface-muted)}
.g-ddempty{padding:14px;text-align:center;color:var(--hatch-widget-muted);font-size:13px}
.g-btn{width:100%;padding:13px;border:none;border-radius:14px;background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);font-size:16px;font-weight:800;cursor:pointer;margin-top:18px}
.g-btn.ghost{background:var(--hatch-widget-surface-muted);color:var(--hatch-widget-text);border:1px solid var(--hatch-widget-border);margin-top:10px;font-size:14px;font-weight:700}
.g-btn.small{width:auto;padding:9px 18px;font-size:13px;margin-top:0}
.g-btn.tab{width:auto;padding:10px 20px;font-size:14px;margin-top:0;flex:1}
.g-btn.tab.off{background:var(--hatch-widget-surface-muted);color:var(--hatch-widget-text);border:1px solid var(--hatch-widget-border)}
.g-err{min-height:20px;text-align:center;font-weight:700;font-size:13px;color:var(--ibg-bad);margin-top:10px}
.g-filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.g-tabs{display:flex;gap:10px;margin:14px 0 4px}
.g-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.g-stat{background:var(--hatch-widget-surface-muted);border-radius:12px;padding:12px;text-align:center}
.g-stat b{font-size:20px;display:block}.g-stat span{font-size:11px;color:var(--hatch-widget-muted)}
.g-tablewrap{overflow-x:auto;margin-top:8px}
table.g-table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.g-table th,table.g-table td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--hatch-widget-border)}
table.g-table th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--hatch-widget-muted);font-weight:800}
table.g-table tr:last-child td{border-bottom:none}

.g-top1{color:var(--gold)}

function renderSchoolListG(prefix,q){
  var list=document.getElementById(prefix+"-sekolah-list");if(!list)return;
  var query=(q||"").trim().toLowerCase();
  var matches=SCHOOLS.filter(function(s){
    return !query||s[0].toLowerCase().indexOf(query)>=0||s[2].toLowerCase().indexOf(query)>=0;
  }).slice(0,60);
  if(!matches.length){list.innerHTML='<div class="g-ddempty">Sekolah tidak ditemukan</div>';}
  else{list.innerHTML=matches.map(function(s){
    return '<div class="g-dditem" data-v="'+esc(s[0])+'"><b>'+esc(s[0])+'</b><span>Kec. '+esc(s[2])+"</span></div>";

/* ---------- Ambil data ---------- */
function loadData(){
  if(!dbOK){loadError="Koneksi database gagal. Periksa koneksi internet.";renderDash();return;}
  loading=true;loadError=null;renderDash();
  FB.collection(curCol()).orderBy("createdAt","desc").limit(2000).get()
    .then(function(snap){
      allRows=[];
      snap.forEach(function(d){
        var v=d.data();
        allRows.push({
          nama:String(v.nama||"—"),kelas:String(v.kelas||"—"),sekolah:String(v.sekolah||"—"),
          skor:Number(v.skor||0),benar:Number(v.benar||0),total:Number(v.total||0),
          akurasi:Number(v.akurasi||0),mode:String(v.mode||"campuran"),
          createdAt:v.createdAt||null
        });
      });
      if(auth&&auth.role==="admin"&&!adminSekolah&&SCHOOLS.length)adminSekolah=SCHOOLS[0][0];
      loading=false;renderDash();
    })
    .catch(function(err){
      loading=false;
      loadError="Gagal memuat data ("+err.code+"). Pastikan rules Firestore sudah diperbarui.";
      renderDash();
    });
}
function currentSchool(){
  if(!auth)return "";
  if(auth.role==="admin")return adminSekolah;
  return auth.sekolah;
}
function schoolRows(){
  var sk=currentSchool();
  return allRows.filter(function(r){return r.sekolah===sk;});
}
function uniqueKelas(rows){
  var s={},out=[];
  rows.forEach(function(r){if(!s[r.kelas]){s[r.kelas]=1;out.push(r.kelas);}});
  return out.sort();
}
function bestPerStudent(rows){
  var map={};
  rows.forEach(function(r){
    var key=r.nama.toLowerCase().trim()+"|"+r.kelas.toLowerCase().trim()+"|"+r.sekolah;
    if(!map[key]||r.skor>map[key].skor)map[key]=r;
  });
  var arr=Object.keys(map).map(function(k){return map[k];});
  arr.sort(function(a,b){return b.skor-a.skor||b.akurasi-a.akurasi;});
  return arr;
}

/* ---------- Tampilan: Sekolah Saya ---------- */
function schoolViewHTML(){
  var sk=currentSchool();
  var rows=schoolRows().filter(function(r){
    if(kelasFilter!=="all"&&r.kelas!==kelasFilter)return false;
    if(namaSearch&&r.nama.toLowerCase().indexOf(namaSearch.toLowerCase())<0)return false;
    return true;
  });
  var lb=bestPerStudent(rows).slice(0,10);
  var siswaUnik={},totSkor=0;
  rows.forEach(function(r){siswaUnik[r.nama.toLowerCase().trim()+"|"+r.kelas]=1;totSkor+=r.skor;});
  var nSiswa=Object.keys(siswaUnik).length;
  var avg=rows.length?Math.round(totSkor/rows.length):0;

  var h="";
  if(auth.role==="admin"){
    h+='<div class="g-label">Lihat Sekolah</div>'+schoolComboHTML("ga","Ketik untuk cari sekolah...",sk);
  }
  h+='<div class="g-filters">'+
    '<div><div class="g-label">Filter Kelas</div><select id="g-kelas" class="g-select"><option value="all">Semua Kelas</option>'+
    uniqueKelas(schoolRows()).map(function(k){return '<option value="'+esc(k)+'"'+(kelasFilter===k?" selected":"")+">Kelas "+esc(k)+"</option>";}).join("")+"</select></div>"+
    '<div><div class="g-label">Cari Nama</div><input id="g-cari" class="g-input" type="text" placeholder="Ketik nama..." value="'+esc(namaSearch)+'"></div>'+
  "</div>"+
  '<div class="g-stats">'+
    '<div class="g-stat"><b>'+rows.length+'</b><span>Percobaan</span></div>'+
    '<div class="g-stat"><b>'+nSiswa+'</b><span>Siswa</span></div>'+
    '<div class="g-stat"><b>'+avg+'</b><span>Rata-rata skor</span></div>'+
  "</div>";

  h+='<p class="g-title" style="font-size:18px;margin-top:18px">🥇 Peringkat Teratas</p>'+
     '<p class="g-sub">Skor terbaik tiap siswa'+(kelasFilter!=="all"?" — Kelas "+esc(kelasFilter):"")+"</p>";
  if(loading)h+='<div class="g-empty">⏳ Memuat data...</div>';
  else if(loadError)h+='<div class="g-empty">⚠️ '+esc(loadError)+"</div>";
  else if(!lb.length)h+='<div class="g-empty">Belum ada data nilai.<br>Siswa yang sudah bermain akan muncul di sini.</div>';
  else{
    h+='<div class="g-tablewrap"><table class="g-table"><tr><th class="g-rank">#</th><th>Nama</th><th>Kelas</th><th>Skor</th><th>Akurasi</th></tr>';
    lb.forEach(function(r,i){
      var medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1);
      h+="<tr><td class=\"g-rank"+(i===0?" g-top1":"")+"\">"+medal+"</td><td><b>"+esc(r.nama)+"</b></td><td>"+esc(r.kelas)+"</td><td><b>"+r.skor+"</b></td><td>"+r.akurasi+"%</td></tr>";
    });
    h+="</table></div>";
  }

  h+='<p class="g-title" style="font-size:18px;margin-top:18px">📋 Rekap Semua Nilai</p>';
  if(loading)h+='<div class="g-empty">⏳ Memuat data...</div>';
  else if(loadError)h+='<div class="g-empty">⚠️ '+esc(loadError)+"</div>";
  else if(!rows.length)h+='<div class="g-empty">Belum ada data.</div>';
  else{
    h+='<div class="g-tablewrap"><table class="g-table"><tr><th class="g-rank">#</th><th>Nama</th><th>Kelas</th><th>Skor</th><th>Benar</th><th>Akurasi</th><th>Waktu</th></tr>';
    rows.forEach(function(r,i){
      h+="<tr><td class=\"g-rank\">"+(i+1)+"</td><td>"+esc(r.nama)+"</td><td>"+esc(r.kelas)+"</td><td><b>"+r.skor+"</b></td><td>"+r.benar+"/"+r.total+"</td><td>"+r.akurasi+"%</td><td>"+esc(fmtDate(r.createdAt))+"</td></tr>";
    });
    h+="</table></div>";
  }
  h+='<p class="g-note">Menampilkan '+rows.length+' percobaan.</p>';
  return h;
}

/* ---------- Tampilan: Rekap Kabupaten ---------- */
function kabViewHTML(){
  var top=bestPerStudent(allRows).slice(0,20);
  var bySchool={};
  allRows.forEach(function(r){
    var k=r.sekolah||"—";
    (bySchool[k]=bySchool[k]||[]).push(r);
  });
  var schoolRank=Object.keys(bySchool).map(function(k){
    var best=bestPerStudent(bySchool[k]);
    var sum=0;best.forEach(function(r){sum+=r.skor;});
    var max=0;best.forEach(function(r){if(r.skor>max)max=r.skor;});
    return{sekolah:k,siswa:best.length,avg:best.length?Math.round(sum/best.length):0,best:max};
  });
  schoolRank.sort(function(a,b){return b.avg-a.avg||b.best-a.best;});

  var h='<p class="g-title" style="font-size:18px">🏆 Top 20 Siswa se-Kabupaten</p>'+
    '<p class="g-sub">Skor terbaik tiap siswa di seluruh Kabupaten Pacitan</p>';
  if(loading)h+='<div class="g-empty">⏳ Memuat data...</div>';
  else if(loadError)h+='<div class="g-empty">⚠️ '+esc(loadError)+"</div>";
  else if(!top.length)h+='<div class="g-empty">Belum ada data nilai.</div>';
  else{
    h+='<div class="g-tablewrap"><table class="g-table"><tr><th class="g-rank">#</th><th>Nama</th><th>Sekolah</th><th>Skor</th><th>Akurasi</th></tr>';
    top.forEach(function(r,i){
      var medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1);
      h+="<tr><td class=\"g-rank"+(i===0?" g-top1":"")+"\">"+medal+"</td><td><b>"+esc(r.nama)+"</b></td><td style='font-size:12px'>"+esc(r.sekolah)+"</td><td><b>"+r.skor+"</b></td><td>"+r.akurasi+"%</td></tr>";
    });
    h+="</table></div>";
  }

  h+='<p class="g-title" style="font-size:18px;margin-top:18px">🏫 Peringkat Sekolah</p>'+
     '<p class="g-sub">Berdasarkan rata-rata skor terbaik tiap siswa</p>';
  if(!loading&&!loadError&&schoolRank.length){
    h+='<div class="g-tablewrap"><table class="g-table"><tr><th class="g-rank">#</th><th>Sekolah</th><th>Siswa</th><th>Rata-rata</th><th>Terbaik</th></tr>';
    schoolRank.forEach(function(s,i){
      h+="<tr><td class=\"g-rank"+(i===0?" g-top1":"")+"\">"+(i+1)+"</td><td style='font-size:12px'><b>"+esc(s.sekolah)+"</b></td><td>"+s.siswa+"</td><td><b>"+s.avg+"</b></td><td>"+s.best+"</td></tr>";
    });
    h+="</table></div>";
  }else if(!loading&&!loadError){
    h+='<div class="g-empty">Belum ada data.</div>';
  }
  h+='<p class="g-note">Rekap kabupaten — untuk melihat posisi siswa di tingkat kabupaten.</p>';
  return h;
}

/* ---------- Dashboard ---------- */
function showDash(){loadData();}
function renderDash(){
  if(!auth){showLogin();return;}
  var isAdmin=auth.role==="admin";
  var roleLabel=isAdmin?"👑 Admin Kabupaten Pacitan":"🏫 "+auth.sekolah;
  var tabSekolah=isAdmin?"🏫 Per Sekolah":"🏫 Sekolah Saya";

  var h='<div class="g-card">'+
    '<div class="g-head"><div><p class="g-title" style="text-align:left">🏆 Leaderboard Guru</p>'+
    '<p class="g-sub" style="text-align:left">Kuis '+esc(curGame().label)+" — se-Kabupaten Pacitan</p>"+
    '<span class="g-role">'+esc(roleLabel)+"</span></div>"+
    '<div><button class="g-btn small" id="g-refresh">↻ Muat Ulang</button> '+
    '<button class="g-btn small ghost" id="g-keluar" style="margin-top:0">Keluar</button></div></div>'+
    '<div class="g-label">Pilih Game</div>'+
    '<div class="g-tabs" style="margin-top:0">'+
      GAMES.map(function(g,i){return '<button class="g-btn tab'+(i===gameIdx?"":" off")+'" data-game="'+i+'">'+g.icon+" "+g.label+"</button>";}).join("")+
    "</div>"+
    '<div class="g-tabs">'+
      '<button class="g-btn tab'+(tab==="sekolah"?"":" off")+'" id="g-tabsekolah">'+tabSekolah+"</button>"+
      '<button class="g-btn tab'+(tab==="kab"?"":" off")+'" id="g-tabkab">🌍 Rekap Kabupaten</button>'+
    "</div>"+
  "</div>";

  h+='<div class="g-card">'+(tab==="sekolah"?schoolViewHTML():kabViewHTML())+"</div>";
  root.innerHTML=h;

  document.getElementById("g-tabsekolah").addEventListener("click",function(){tab="sekolah";renderDash();});
  document.getElementById("g-tabkab").addEventListener("click",function(){tab="kab";renderDash();});
  var gbtns=root.querySelectorAll("[data-game]");
  for(var gi=0;gi<gbtns.length;gi++)(function(b){
    b.addEventListener("click",function(){gameIdx=parseInt(b.getAttribute("data-game"),10);tab="sekolah";loadData();});
  })(gbtns[gi]);
  document.getElementById("g-refresh").addEventListener("click",loadData);
  document.getElementById("g-keluar").addEventListener("click",function(){try{sessionStorage.removeItem("guru_auth");}catch(e){}auth=null;showLogin();});
  var ask=document.getElementById("ga-sekolah-input");
  if(ask)bindSchoolComboG("ga",function(v){adminSekolah=v;renderDash();});
  var ks=document.getElementById("g-kelas");
  if(ks)ks.addEventListener("change",function(e){kelasFilter=e.target.value;renderDash();});
  var cari=document.getElementById("g-cari");
  if(cari)cari.addEventListener("input",function(e){namaSearch=e.target.value;renderDash();var c2=document.getElementById("g-cari");if(c2){c2.focus();c2.setSelectionRange(c2.value.length,c2.value.length);}});
}

if(auth)showDash();else showLogin();
})();
</script>
