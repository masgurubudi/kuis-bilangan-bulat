html,body{margin:0;padding:0}
body{

#ibg-root{width:100%;max-width:520px}
.ibg-card{background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:18px;padding:20px;box-shadow:0 4px 18px var(--hatch-widget-shadow)}

.ibg-label{font-size:12px;font-weight:700;color:var(--hatch-widget-muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.ibg-input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--hatch-widget-border);background:var(--hatch-widget-surface-muted);color:var(--hatch-widget-text);font-size:15px;font-weight:600;margin-bottom:2px}
.ibg-input:focus{outline:2px solid var(--hatch-widget-focus);outline-offset:1px;border-color:var(--hatch-widget-accent)}
.ibg-dd{position:relative}
.ibg-ddlist{position:absolute;top:100%;left:0;right:0;max-height:260px;overflow-y:auto;background:var(--hatch-widget-surface);border:1.5px solid var(--hatch-widget-border);border-radius:12px;margin-top:4px;z-index:50;display:none;box-shadow:0 8px 24px var(--hatch-widget-shadow)}
.ibg-dditem{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--hatch-widget-border)}
.ibg-dditem:last-child{border-bottom:none}
.ibg-dditem b{display:block;font-size:14px}
.ibg-dditem span{font-size:11px;color:var(--hatch-widget-muted)}
.ibg-dditem:active{background:var(--hatch-widget-surface-muted)}
.ibg-ddempty{padding:14px;text-align:center;color:var(--hatch-widget-muted);font-size:13px}
.ibg-btn{width:100%;padding:13px;border:none;border-radius:14px;background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);font-size:16px;font-weight:800;cursor:pointer;margin-top:18px}
.ibg-btn.ghost{background:var(--hatch-widget-surface-muted);color:var(--hatch-widget-text);border:1px solid var(--hatch-widget-border);margin-top:10px;font-size:14px;font-weight:700}
.ibg-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--hatch-widget-muted);margin-bottom:8px}
.ibg-score{font-weight:800;color:var(--hatch-widget-text);font-size:15px}
.ibg-pbar{height:8px;background:var(--hatch-widget-surface-muted);border-radius:99px;overflow:hidden;margin-bottom:14px}
.ibg-pfill{height:100%;background:var(--hatch-widget-accent);border-radius:99px;transition:width .3s}
.ibg-cat{display:inline-block;background:var(--hatch-widget-surface-muted);border:1px solid var(--hatch-widget-border);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700;color:var(--hatch-widget-muted);margin-bottom:10px}
.ibg-stim{background:var(--hatch-widget-surface-muted);border-left:4px solid var(--hatch-widget-accent);border-radius:0 12px 12px 0;padding:12px 14px;font-size:14px;line-height:1.65;margin:0 0 12px}
.ibg-stim b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--hatch-widget-muted);display:block;margin-bottom:4px}
.ibg-q{font-size:17px;font-weight:800;margin:4px 0 10px;line-height:1.5}
.ibg-choices{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}
.ibg-choice{padding:13px 12px;border-radius:14px;border:2px solid var(--hatch-widget-border);background:var(--hatch-widget-surface-muted);color:var(--hatch-widget-text);font-size:15px;font-weight:600;cursor:pointer;text-align:left;transition:transform .08s;line-height:1.45}
.ibg-choice:active{transform:scale(.98)}
.ibg-choice.correct{border-color:var(--ibg-ok);background:rgba(31,157,99,.12);color:var(--ibg-ok)}
.ibg-choice.wrong{border-color:var(--ibg-bad);background:rgba(229,72,77,.12);color:var(--ibg-bad)}
.ibg-choice:disabled{cursor:default}
.ibg-feed{min-height:26px;text-align:center;font-weight:700;font-size:14px;margin-top:12px;line-height:1.4}
.ibg-feed.ok{color:var(--ibg-ok)}.ibg-feed.no{color:var(--ibg-bad)}
.ibg-big{font-size:52px;font-weight:800;text-align:center;margin:6px 0}
.ibg-stars{font-size:34px;text-align:center;margin:4px 0;letter-spacing:4px}
.ibg-msg{text-align:center;color:var(--hatch-widget-muted);font-size:14px;margin:0 0 4px;line-height:1.5}
.ibg-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0 4px}
.ibg-stat{background:var(--hatch-widget-surface-muted);border-radius:12px;padding:12px;text-align:center}
.ibg-stat b{font-size:20px;display:block}.ibg-stat span{font-size:11px;color:var(--hatch-widget-muted)}
.ibg-namecard{text-align:center;background:var(--hatch-widget-surface-muted);border-radius:12px;padding:10px;margin:10px 0 4px;font-size:14px;font-weight:700;line-height:1.5}

function renderSchoolList(q){
  var list=document.getElementById("ibg-sekolah-list");if(!list)return;
  var query=(q||"").trim().toLowerCase();
  var matches=SCHOOLS.filter(function(s){
    return !query||s[0].toLowerCase().indexOf(query)>=0||s[2].toLowerCase().indexOf(query)>=0;
  }).slice(0,60);
  if(!matches.length){list.innerHTML='<div class="ibg-ddempty">Sekolah tidak ditemukan</div>';}
  else{list.innerHTML=matches.map(function(s){
    return '<div class="ibg-dditem" data-v="'+esc(s[0])+'"><b>'+esc(s[0])+'</b><span>Kec. '+esc(s[2])+"</span></div>";
  }).join("");}
  list.style.display="block";
}
function hideSchoolList(){var l=document.getElementById("ibg-sekolah-list");if(l)l.style.display="none";}
function bindSchoolCombo(){
  var inp=document.getElementById("ibg-sekolah-input");
  var list=document.getElementById("ibg-sekolah-list");
  if(!inp||!list)return;
  inp.addEventListener("input",function(){renderSchoolList(inp.value);});
  inp.addEventListener("focus",function(){renderSchoolList(inp.value);});
  list.addEventListener("click",function(e){
    var it=e.target.closest(".ibg-dditem");if(!it)return;
    player.sekolah=it.getAttribute("data-v");menuMsg=null;saveState();render();
  });
}
function resolveSchool(){
  var inp=document.getElementById("ibg-sekolah-input");
  var typed=inp?inp.value.trim():"";
  if(!typed)return "";
  var tl=typed.toLowerCase();
  if(player.sekolah&&player.sekolah.toLowerCase()===tl)return player.sekolah;
  for(var i=0;i<SCHOOLS.length;i++)if(SCHOOLS[i][0].toLowerCase()===tl)return SCHOOLS[i][0];
  return "";
}

  '<div class="ibg-label">Kelas</div>'+
  '<input id="ibg-kelas" class="ibg-input" type="text" maxlength="20" placeholder="Contoh: 7A" value="'+esc(player.kelas)+'">'+
  '<div class="ibg-label">Nama Sekolah</div>'+schoolComboHTML()+
  '<button class="ibg-btn" id="ibg-start">Mulai Bermain</button>'+
  '<div class="ibg-menu-msg">'+(menuMsg?esc(menuMsg):"")+"</div>"+
  '<p class="ibg-credit">Dibuat oleh MGMP Matematika SMP Kabupaten Pacitan</p>';
  bindSchoolCombo();
  document.getElementById("ibg-start").addEventListener("click",function(){
    var nm=document.getElementById("ibg-nama").value.trim();
    var kl=document.getElementById("ibg-kelas").value.trim();
    var sk=resolveSchool();
    if(!nm||!kl||!sk){menuMsg="Isi nama, kelas, dan pilih sekolah dari daftar ya!";showStart();return;}
    player.nama=nm;player.kelas=kl;player.sekolah=sk;menuMsg=null;saveState();
    quiz=shuffle(BANK).slice(0,TOTAL_Q).map(function(q){
      var order=shuffle([0,1,2,3]);
      return{stim:q.stim,q:q.q,cat:q.cat,opts:order.map(function(i){return q.a[i];}),c:order.indexOf(q.c)};
    });
    idx=0;score=0;correctLit=0;correctNum=0;saved=0;showQ();
  });
}
function showQ(){
  answered=false;
  var q=quiz[idx];
  root.innerHTML=
  '<div class="ibg-top"><span>Soal '+(idx+1)+" / "+quiz.length+'</span><span class="ibg-score">⭐ '+score+"</span></div>"+
  '<div class="ibg-pbar"><div class="ibg-pfill" style="width:'+(idx/quiz.length*100)+'%"></div></div>'+
  '<span class="ibg-cat">'+(q.cat==="Literasi"?"📖 Literasi":"🔢 Numerasi")+"</span>"+
  '<div class="ibg-stim"><b>📄 Bacaan</b>'+esc(q.stim)+"</div>"+
  '<p class="ibg-q">'+esc(q.q)+"</p>"+
  '<div class="ibg-choices" id="ibg-choices">'+
    q.opts.map(function(o,i){return '<button class="ibg-choice" data-i="'+i+'">'+esc(o)+"</button>";}).join("")+
  "</div>"+
  '<div class="ibg-feed" id="ibg-feed"></div>';
  document.getElementById("ibg-choices").addEventListener("click",function(e){
    var b=e.target.closest(".ibg-choice");
    if(!b||answered)return;
    answered=true;
    var pick=parseInt(b.getAttribute("data-i"),10);
    var btns=root.querySelectorAll(".ibg-choice");
    for(var i=0;i<btns.length;i++)btns[i].disabled=true;
    var feed=document.getElementById("ibg-feed");
    if(pick===q.c){
      score++;
      if(q.cat==="Literasi")correctLit++;else correctNum++;
      b.classList.add("correct");
      feed.textContent=["Hebat! 🎉","Betul sekali! 👏","Pintar! ⭐","Bagus! 💪"][Math.floor(Math.random()*4)];
      feed.className="ibg-feed ok";
    }else{
      b.classList.add("wrong");
      btns[q.c].classList.add("correct");
      feed.textContent="Kurang tepat. Jawaban benar: "+q.opts[q.c];
      feed.className="ibg-feed no";
    }
    root.querySelector(".ibg-score").textContent="⭐ "+score;
    setTimeout(function(){idx++;idx<quiz.length?showQ():showResult();},1600);
  });
}
function saveScore(){
  if(!FB){saved=3;renderResult();return;}
  saved=1;renderResult();
  var acc=Math.round(score/quiz.length*100);
  try{
    FB.collection(SCORE_COLLECTION).add({
      nama:player.nama,kelas:player.kelas,sekolah:player.sekolah,
      skor:score,benar:score,total:quiz.length,akurasi:acc,
      benarLiterasi:correctLit,benarNumerasi:correctNum,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){saved=2;renderResult();})
     .catch(function(){saved=3;renderResult();});
  }catch(e){saved=3;renderResult();}
}
function saveStatHTML(){
  if(saved===2)return '<p class="ibg-savestat ok">✅ Nilai tersimpan di database</p>';
  if(saved===1)return '<p class="ibg-savestat wait">⏳ Menyimpan nilai...</p>';
  return '<p class="ibg-savestat fail">⚠️ Nilai tidak tersimpan (periksa koneksi)</p>';
}
function showResult(){saveScore();}
function renderResult(){
  var pct=Math.round(score/quiz.length*100);
  var stars="⭐",msg="Terus berlatih ya, kamu pasti bisa! 💪";
  if(pct>=90){stars="⭐⭐⭐";msg="Luar biasa! Kamu master literasi & numerasi! 🌟";}
  else if(pct>=70){stars="⭐⭐";msg="Hebat! Sedikit lagi sempurna! 🎉";}
  else if(pct>=50){stars="⭐";msg="Bagus! Terus semangat belajar! 📚";}
  root.innerHTML=
  '<p class="ibg-title">Hasil Kuis</p>'+
  '<div class="ibg-namecard">👤 '+esc(player.nama)+" &bull; Kelas "+esc(player.kelas)+
  '<br><span style="font-size:12px;font-weight:600;color:var(--hatch-widget-muted)">'+esc(player.sekolah)+"</span></div>"+
  saveStatHTML()+
  '<div class="ibg-stars">'+stars+"</div>"+
  '<p class="ibg-big">'+score+"/"+quiz.length+"</p>"+
  '<p class="ibg-msg">'+msg+"</p>"+
  '<div class="ibg-stats">'+
    '<div class="ibg-stat"><b>'+correctLit+'</b><span>Literasi benar</span></div>'+
    '<div class="ibg-stat"><b>'+correctNum+'</b><span>Numerasi benar</span></div>'+
    '<div class="ibg-stat"><b>'+pct+'%</b><span>Nilai</span></div>'+
  "</div>"+
  '<button class="ibg-btn" id="ibg-again">Main Lagi 🔄</button>'+
  '<button class="ibg-btn ghost" id="ibg-home">Ganti Nama / Sekolah</button>'+
  '<p class="ibg-credit">Dibuat oleh MGMP Matematika SMP Kabupaten Pacitan</p>';
  document.getElementById("ibg-again").addEventListener("click",function(){
    quiz=shuffle(BANK).slice(0,TOTAL_Q).map(function(q){
      var order=shuffle([0,1,2,3]);
      return{stim:q.stim,q:q.q,cat:q.cat,opts:order.map(function(i){return q.a[i];}),c:order.indexOf(q.c)};
    });
    idx=0;score=0;correctLit=0;correctNum=0;saved=0;showQ();
  });
  document.getElementById("ibg-home").addEventListener("click",showStart);
}
function render(){showStart();}
render();
})();
</script>
</body>
</html>
